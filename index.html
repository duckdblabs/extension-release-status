<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckDB Extension Release Status</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --fg: #1a1a1a;
    --muted: #767676;
    --card-bg: #f6f6f7;
    --border: #e2e2e2;
    --link: #0a58ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e6e6e6;
      --muted: #9a9a9a;
      --card-bg: #1c1f26;
      --border: #33363f;
      --link: #7ab7ff;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 2.5rem auto;
    padding: 0 1.25rem;
    color: var(--fg);
    background: var(--bg);
  }
  a { color: var(--link); }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 0.6rem;
  }
  li a {
    display: block;
    padding: 0.75rem 1rem;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
  }
  li:hover { background: var(--card-bg); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
  <h1>DuckDB Extension Release Status</h1>
  
  <ul>
    
    <li><a href="v2.0.0/">v2.0.0</a></li>
    
    <li><a href="v1.5.6/">v1.5.6</a></li>
    
  </ul>
  
</body>
</html>
