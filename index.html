<style>
/* Shared palette from the DuckDB design manual (duckdb.org/design/manual): brand yellow, the two secondaries, and its syntax palette for states. */
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0d0d0d;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(13,13,13,.10);--wash:rgba(13,13,13,.035);
  --brand:#fff100;--brand-ink:#0d0d0d;--logo-disc:#1a1a1a;--logo-duck:#fff100;
  /* Maya Blue (#2eafff) is under 3:1 on white, so light mode draws marks in its darker step and links in --link; pills on the secondaries take dark ink. */
  --s1:#1684c9;--s2:#ff6900;--s3:#008700;--s7:#7b68ee;--link:#005fff;
  --o1:#c4e8ff;--o2:#86d0ff;--o3:#2eafff;--o4:#1684c9;--o5:#0c5a8c;
  --good:#008700;--warn:#fab219;--serious:#ff6900;--crit:#d70000;
  --goodtext:#008700;--badtext:#d70000;--warntext:#875f00;
  /* Series colours: overridden with the GitHub label colours when generate.py could fetch them. */
  --blocker:#9f1d1d;--must:var(--s1);--nice:var(--s2);--blocker-ink:#fff;--must-ink:#0d0d0d;--nice-ink:#0d0d0d;
  --blocker-line:var(--blocker);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0d0d0d;--surface:#1e1e1e;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2c;--axis:#383838;--border:rgba(255,255,255,.10);--wash:rgba(255,255,255,.04);
    --logo-disc:#fff100;--logo-duck:#1d1d1b;
    --s1:#2eafff;--s3:#00af00;--s7:#9d8fff;--link:#5fafff;
    --o1:#0c5a8c;--o2:#1684c9;--o3:#2eafff;--o4:#86d0ff;--o5:#c4e8ff;
    --good:#00af00;
    --goodtext:#00af00;--badtext:#ff6a6a;--warntext:#ffd700;
    --blocker-line:#ff4d2e;
  }
}
/* Violet, not sand, for the extension page: amber, green and red are taken by its own pin and patch states */
html.tint-release{--page:#d7e8f4;--surface:#ecf4fa;--grid:#c8dbe9;--axis:#9db2c4;--ink2:#454b55;--muted:#676d77}
html.tint-ext{--page:#e5ddf7;--surface:#f5f1fd;--grid:#d8d0ef;--axis:#aa9fcd;--ink2:#4a4559;--muted:#6c677e}
@media (prefers-color-scheme:dark){
  html.tint-release{--page:#0c1b2b;--surface:#18283a;--grid:#293a4d;--axis:#374a5e;--ink2:#c0c9d6;--muted:#89909b}
  html.tint-ext{--page:#191331;--surface:#262040;--grid:#383055;--axis:#473e68;--ink2:#c8c3da;--muted:#918ca2}
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:34px;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.brand{display:flex;align-items:flex-start;gap:14px;min-width:0}
.brand-mark{flex:none;width:40px;height:40px}
/* Components shared by the release dashboard and the extension status page: tabs, cards, tiles, hero, status, queue, owner and data tables */
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1600px;margin:0 auto;padding:24px 24px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.sub{color:var(--ink2)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px;margin-bottom:16px;padding:20px 24px}
.countdown{display:flex;align-items:baseline;gap:10px;flex:none}
.countdown .big{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.countdown .unit{font-size:18px;color:var(--ink2);font-weight:500}
.phase{flex:1 1 520px;min-width:0}
.phase .now{font-size:15px;color:var(--ink2);margin-bottom:12px}
.phase .now b{color:var(--ink);font-size:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
/* Railroad track: the rail's right overhang must equal the .steps gap (6px, 12px on tv) so it joins the next junction. */
.steps li{position:relative;padding-top:24px;font-size:14px;color:var(--muted);min-width:0}
.steps li::before{content:"";position:absolute;left:0;right:-6px;top:6px;height:3px;border-radius:2px;background:var(--grid)}
.steps li:last-child::before{display:none}
.steps li::after{content:"";position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--axis)}
.steps li b{display:block;font-size:16px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.steps li.done::before{background:var(--ink2)}
.steps li.done::after{background:var(--ink2);border-color:var(--ink2)}
.steps li.done b::before{content:"✓ "}
.steps li.current::after{background:var(--brand);border-color:var(--ink)}
.steps li.current b{color:var(--ink)}
.steps li.current b::after{content:"Now";margin-left:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--brand);color:var(--brand-ink);border-radius:4px;padding:1px 5px;vertical-align:1px}
.status{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;max-width:560px}
.status .ico{width:28px;height:28px;border-radius:50%;background:var(--serious);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;flex:none}
.status.on_track .ico{background:var(--good);color:#fff}
.status.at_risk .ico{background:var(--warn);color:var(--brand-ink)}
.status.blocked .ico{background:var(--crit);color:#fff}
.status b{display:block;font-size:16px}
/* 22 and 24%, not 9 and 10: a tinted surface swallows a wash that thin, and this card has to win the eye */
.status.blocked{background:color-mix(in srgb,var(--crit) 22%,var(--surface));border-color:color-mix(in srgb,var(--crit) 35%,transparent);box-shadow:inset 4px 0 0 var(--crit)}
.status.at_risk{background:color-mix(in srgb,var(--warn) 24%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,transparent);box-shadow:inset 4px 0 0 var(--warn)}
.status.blocked b{color:var(--badtext)}
.status ul{margin:4px 0 0;padding-left:16px;color:var(--ink2);font-size:13px}
.status ul li{margin:1px 0}
.tabs{display:flex;gap:4px;border:1px solid var(--border);border-radius:999px;padding:3px;background:var(--surface)}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--ink2);border-radius:999px;padding:5px 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--surface)}
.tabs.mini{padding:2px}.tabs.mini button{font-size:11px;padding:3px 10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.cardhead h2{margin:0}
.cardhead .more{padding:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h2{font-size:16px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
.card .hint{color:var(--muted);font-size:12px;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column}
.kpi>svg,.kpi>.strip{margin-top:auto!important;padding-top:10px}
.kpi .lab{color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
@media (min-width:1251px){.kpi .lab{min-height:2.9em}}
.kpi .val{font-size:32px;font-weight:650;line-height:1.1;margin:4px 0 2px}
.kpi .val small{font-size:14px;color:var(--ink2);font-weight:500}
.kpi .delta{font-size:12px;color:var(--ink2)}
.kpi svg{display:block}
.kpis>*,.row>*{min-width:0}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.strip.ci{display:grid;grid-template-columns:repeat(7,14px);gap:4px}
.kpi>.cirows{margin-top:auto;padding-top:4px}.cirow+.cirow{margin-top:8px}
.cihead{display:block;font-size:12px;line-height:1.2;color:var(--ink2)}.cihead b{font-size:14px;color:var(--ink)}.cirow .strip{margin-top:3px}
.strip i,.sq{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
/* .sq: the same square loose in text or a legend; the status page colours it per state */
.sq{display:inline-block;vertical-align:middle;background:var(--grid)}
.strip i.ok,.sq.ok{background:var(--good)}.strip i.fail,.sq.broken{background:var(--crit)}.sq.behind{background:var(--warn)}.sq.held{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.row{display:grid;gap:16px;margin-bottom:16px}
/* start, not stretch: a short By owner or Ready card keeps its own height next to a long queue */
.r-queue{grid-template-columns:1.4fr 1fr;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.r-main{grid-template-columns:1.75fr 1fr}
.r-two{grid-template-columns:1fr 1fr}
.queue{list-style:none;margin:0;padding:0;counter-reset:q}
.queue li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--grid);font-size:13px}
.queue li:first-child{border-top:0}
.queue li::before{counter-increment:q;content:counter(q);color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;width:1.4em;flex:none;text-align:right}
.queue .verb{font-weight:600;flex:none;white-space:nowrap}
/* Verbs are one colour, link or not; a muted underline marks the clickable ones before hover */
.queue .verb a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--grid);text-underline-offset:2px}
.queue .r0::before{color:var(--badtext);font-weight:800}
/* Neither why span shrinks; the last one is capped at 40% of the row and ellipsizes there, so a long why can't push a short step onto two lines while a short why keeps its natural width. */
.queue :is(.k-check,.k-subissue) .verb{white-space:normal;flex:0 1 auto;font-weight:500}
.queue .k-check .verb code{font-size:12px;overflow-wrap:anywhere}
.queue :is(.k-check,.k-subissue) .why{flex:none;white-space:nowrap}
.queue :is(.k-check,.k-subissue) span.why:last-of-type{max-width:40%;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere}
.queue .why{color:var(--muted);font-size:12px}
.queue .goto{margin-left:auto;font:inherit;font-size:11px;font-weight:600;color:var(--ink2);background:none;border:1px solid var(--border);border-radius:999px;padding:1px 9px;cursor:pointer;white-space:nowrap}
.queue .goto:hover{color:var(--link);border-color:color-mix(in srgb,var(--link) 40%,transparent);background:color-mix(in srgb,var(--link) 10%,transparent);text-decoration:none}
.queue input.done{margin:2px 0 0;flex:none;align-self:flex-start;accent-color:var(--s1)}
.queue li.done>:not(input,textarea){opacity:.55}
.queue li.done .verb{text-decoration:line-through}
.queue textarea.note{flex:1 1 8em;min-width:6em;font-size:12px;border-color:var(--border)}
.queue li.morerow::before,.queue li.sec::before{counter-increment:none;content:""}
.queue li.morerow{border-top:0}
.queue li.sec{padding:18px 0 6px;border-top:2px solid var(--axis);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.queue li.sec:first-child{padding-top:6px;border-top:0}
.queue li.sec .verb{font-weight:700}
.queue li.sec .count{color:var(--muted)}
.queue li.sec+li{border-top:0}
.owners td,.owners th{padding:6px}
#owners tr{cursor:pointer}
.owners button.prs{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer}.owners button.prs:hover,.owners button.prs:focus-visible{text-decoration:underline}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 8px;border-bottom:1px solid var(--axis);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th:hover{color:var(--ink)}
/* Short table that scrolls with the page: a sticky header would float alone; wrapped headers keep its seven columns inside the card */
.tbl.owners th{position:static;white-space:normal;vertical-align:bottom}
.tbl th .arr{color:var(--muted);font-size:10px;margin-left:3px}
.tbl td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
.tbl tr:hover td{background:var(--wash)}
.tbl tr.flash td{background:color-mix(in srgb,var(--s1) 22%,var(--surface))}
.tscroll{overflow:auto;max-height:max(320px,calc(100vh - 360px));border-top:1px solid var(--axis);border-bottom:1px solid var(--axis)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--ink2);font-size:16px;line-height:1;width:12px;transition:transform .12s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary h2{margin:0}
details.fold>summary:hover h2{text-decoration:underline}
details.fold .count,.card h2 .count{color:var(--muted);font-size:12px;font-weight:400}details.fold .count:empty{display:none}
details.fold .count:not(:empty)+.count:not(:empty)::before{content:"· "}
details.fold .count.stale,.card h2 .count.stale{color:var(--warntext);font-weight:600}
.tbl.dates th{cursor:default}.tbl.dates th:hover{color:var(--ink2)}.tbl.dates td{font-variant-numeric:tabular-nums}
/* No hover wash: these rows do nothing on click */
.tbl.dates tr:hover td{background:none}
/* Dates only: the published table's chase texts must keep wrapping */
.tbl.dates:not(.published) td:not(:first-child){white-space:nowrap}
.tbl.published td{white-space:normal}.tbl.published .muted{color:var(--muted)}.tbl.dates td.muted{color:var(--muted)}.tbl.dates td.off,.tbl.dates tr.off td:first-child{color:var(--warntext);font-weight:600}
/* The overdue channel's name is a link: keep the warning colour over the link blue */
.tbl.dates tr.off td:first-child a{color:inherit}
.more{font:inherit;font-size:12px;font-weight:600;color:var(--link);background:none;border:0;padding:10px 0 0;cursor:pointer}
.more:hover{text-decoration:underline}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filters button{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--page);color:var(--ink2);border-radius:999px;padding:3px 12px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters .ghlink{margin-left:auto}
html.tv .wrap{max-width:1900px}
html.tv .countdown .big{font-size:120px}
html.tv .kpi .val{font-size:44px}
html.tv .card h2{font-size:22px}html.tv .hint{font-size:15px}
html.tv .kpi .lab{font-size:17px}html.tv .phase .now{font-size:20px}html.tv .phase .now b{font-size:24px}
html.tv .steps{gap:12px}html.tv .steps li{padding-top:30px;font-size:18px}html.tv .steps li::before{height:4px;top:8px;right:-12px}html.tv .steps li::after{width:20px;height:20px;border-width:4px}html.tv .steps li b{font-size:22px;margin-bottom:4px}
html.tv .steps li.current b::after{font-size:12px;padding:2px 7px}
html.tv .tscroll{max-height:none}
/* Sideways containment only: a height cap would scroll the static header out of view after Show all */
.tscroll.owners-scroll{max-height:none}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1100px){.r-queue{grid-template-columns:1fr}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis>:last-child:nth-child(odd){grid-column:1/-1}.r-main,.r-two{grid-template-columns:1fr}}
@media (max-width:520px){.kpi .val{font-size:26px}
  /* Every caption drops under the verb, indented to its text column; the title keeps the checkbox's line. */
  .queue li{flex-wrap:wrap}.queue .verb{white-space:normal;min-width:0;flex:1 1 0}.queue li.sec .verb{flex:none}.queue span.why{flex:0 0 100%;white-space:normal;order:3;padding-left:48px}.queue span.why .sep{display:none}.queue .goto{order:2}
  .queue li.done span.why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}textarea.tri.note{flex-basis:calc(100% - 48px);max-width:calc(100% - 48px);margin-left:48px;order:4}
  /* Checklist rows keep who and why on one caption line (the ::after breaks the row); a basis-0 why can't wrap away from the who. */
  .queue li:is(.k-check,.k-subissue){row-gap:2px}.queue li:is(.k-check,.k-subissue)::after{content:"";flex-basis:100%;order:2}.queue :is(.k-check,.k-subissue) .verb{flex:1 1 0}.queue :is(.k-check,.k-subissue) .why{white-space:normal}.queue :is(.k-check,.k-subissue) span.why:last-of-type{max-width:none;flex:1 1 0;min-width:0}.queue :is(.k-check,.k-subissue) .why+.why{padding-left:0}.queue :is(.k-check,.k-subissue) .why+.why .sep{display:inline}
  .hero{padding:16px}.countdown .big{font-size:56px}.steps{grid-template-columns:repeat(2,1fr);row-gap:12px}.steps li:nth-child(2n)::before{display:none}}
/* Shared by the extension status page and its release index: the two state axes' colours and the badge pills */
:root {
  --ok-bg: #d8f3dc; --ok-fg: #1b5e20;
  --behind-bg: #ffe8cc; --behind-fg: #8a4b00;
  --patches-bg: #fff6c2; --patches-fg: #5c4a00; --patches-line: #d4b800;
  --blocked-bg: var(--crit); --blocked-fg: #fff;
}
@media (prefers-color-scheme: dark) {
  /* Washes over the tinted surface, like the status card's, so the pills don't float as warm hex on the purple */
  :root { --ok-bg: color-mix(in srgb, var(--good) 28%, var(--surface)); --ok-fg: #8fe3a5;
          --behind-bg: color-mix(in srgb, var(--warn) 30%, var(--surface)); --behind-fg: #ffc987;
          --patches-bg: color-mix(in srgb, var(--patches-line) 28%, var(--surface)); --patches-fg: #e8dc6a; --patches-line: #a89a12; }
}
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 0; background: transparent; font-family: inherit; }
.badge.ok, .chip.ok { background: var(--ok-bg); color: var(--ok-fg); --ring: var(--ok-fg); }
.badge.behind, .chip.behind { background: var(--behind-bg); color: var(--behind-fg); --ring: var(--behind-fg); }
.badge.patches, .chip.patches { background: var(--patches-bg); color: var(--patches-fg); box-shadow: inset 0 0 0 1px var(--patches-line); --ring: var(--patches-fg); }
.badge.blocked, .chip.blocked { background: var(--blocked-bg); color: var(--blocked-fg); --ring: var(--blocked-fg); }
  body { max-width: 640px; margin: 2.5rem auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.6rem;
  }
  li a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 1.05rem;
  }
  li:hover { background: var(--surface); }
  .empty { color: var(--muted); }
</style>
</head>
