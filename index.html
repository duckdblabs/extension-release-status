<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckDB Extension Release Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Shared by the status page and the release index: palette, page and heading */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #0d1a24;
    --muted: #5b6b76;
    --card-bg: #f4f8fb;
    --border: #dde6ec;
    --link: #2c6e91;
    --accent: #fff100;
    --radius-m: 10px;
    --radius-pill: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0f14;
      --fg: #e6edf2;
      --muted: #93a3ad;
      --card-bg: #121a22;
      --border: #22303b;
      --link: #2eafff;
      --accent: #f3e71b;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 0 1.25rem;
    color: var(--fg);
    background: var(--bg);
  }
  a { color: var(--link); text-decoration: none; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  .brand-rule { width: 2.5rem; height: 4px; background: var(--accent); border-radius: var(--radius-pill); }
  :root {
    --ok-bg: #d8f3dc;
    --ok-fg: #1b5e20;
    --behind-bg: #ffe8cc;
    --behind-fg: #8a4b00;
    --blocked-bg: #c0362c;
    --blocked-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ok-bg: #1b3a24;
      --ok-fg: #8fe3a5;
      --behind-bg: #4a2f0f;
      --behind-fg: #ffc987;
      --blocked-bg: #d1453b;
      --blocked-fg: #ffffff;
    }
  }
  body { max-width: 640px; margin: 2.5rem auto; }
  h1 { margin-bottom: 0.35rem; }
  .brand-rule { margin-bottom: 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    margin-bottom: 0.6rem;
  }
  li a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 1.05rem;
  }
  li:hover { background: var(--card-bg); }
  .empty { color: var(--muted); }
  .lvl {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.25rem 0.65rem;
    border-radius: var(--radius-pill);
  }
  .lvl.on_track { background: var(--ok-bg); color: var(--ok-fg); }
  .lvl.at_risk { background: var(--behind-bg); color: var(--behind-fg); }
  .lvl.blocked { background: var(--blocked-bg); color: var(--blocked-fg); }
</style>
</head>
<body>
  <h1>DuckDB Extension Release Status</h1>
  <div class="brand-rule"></div>
  
  <ul>
    
    <li><a href="v2.0.0/">
      <span>v2.0.0</span>
      
      
        <span class="lvl blocked">Blocked</span>
      
    </a></li>
    
    <li><a href="v1.5.6/">
      <span>v1.5.6</span>
      
      
    </a></li>
    
  </ul>
  
</body>
</html>
